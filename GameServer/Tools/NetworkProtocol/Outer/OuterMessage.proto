syntax = "proto3";
package Fantasy.Network.Message;

// 鍗忚鍒嗕负:
// ProtoBuf:鍙互鍦∣uter鍜孖nner鏂囦欢閲屼娇鐢ㄣ€?
// MemoryPack:鍙互鍦∣uter鍜孖nner鏂囦欢閲屼娇鐢ㄣ€?

// 鐩墠宸ュ叿鏀寔浠ヤ笅鍑犵鐗规畩鐢ㄦ硶:
// 鍦╩essage鍗忚涓婃柟娣诲姞// Protocol+绌烘牸+鍗忚鍚嶅瓧
// 渚嬪: // Protocol ProtoBuf 鎴?// Protocol MemoryPack

// 鍒嗗埆浠ｈ〃浣跨敤Protobuf搴忓垪鍖栨垨浣跨敤MemoryPack搴忓垪鍖?
// 閫氳繃娣诲姞 // using 瀵煎嚭鏃舵坊鍔犺嚜瀹氫箟鍛藉悕绌洪棿
// 渚嬪: // using System.Runtime // using System.Reflection

// 娉ㄥ唽璐﹀彿鍗忚
message C2A_RegisterRequest // IRequest,A2C_RegisterResponse
{
	string UserName = 1;
	string Password = 2;
}
// 娉ㄥ唽璐﹀彿鍗忚杩斿洖
message A2C_RegisterResponse // IResponse
{
}

// 鐧诲綍鍗忚
message C2A_LoginRequest // IRequest,A2C_LoginResponse
{
	string UserName = 1;
	string Password = 2;
	uint32 LoginType = 3;
}
// 鐧诲綍鍗忚杩斿洖
message A2C_LoginResponse // IResponse
{
	string Token = 1;
}

// 娴嬭瘯鐧诲綍鎴愬姛鐩存帴鏈嶅姟鍣ㄤ笅鍙戞暟鎹?
message G2C_LoginMessage // IMessage
{
	string Msg = 1;
}

// 客户端请求加入战斗场景
message C2B_JoinBattle // IRequest,C2B_JoinBattleResponse
{
	string Token = 1;
}

// 加入战斗响应
message C2B_JoinBattleResponse // IResponse
{
	int64 PlayerId = 1;
	int64 XRaw = 2;
	int64 YRaw = 3;
	uint32 ServerFrameIndex = 4;
	bool IsReconnect = 5;
}

// 客户端逐帧输入（单向消息）
message C2B_PlayerInput // IMessage
{
	uint32 FrameIndex = 1;
	uint32 InputSeq = 2;
	int64 DxRaw = 3;
	int64 DyRaw = 4;
	int32 SkillId = 5;
}

message BuffSnapshot
{
	int64 RuntimeBuffId = 1;
	int32 BuffId = 2;
	int64 CasterId = 3;
	int64 TargetId = 4;
	int32 StackCount = 5;
	int32 RemainingFrames = 6;
	uint32 AppliedFrame = 7;
	uint32 Flags = 8;
	uint32 DirtyFlags = 9;
}

message NumericModifierSnapshot
{
	int64 SourceBuffId = 1;
	uint32 ValueType = 2;
	uint32 AttributeKind = 3;
	int32 Value = 4;
}

message NumericSnapshot
{
	int32 BaseHealth = 1;
	int32 BaseMaxHealth = 2;
	int32 BaseMana = 3;
	int32 BaseMaxMana = 4;
	int32 BaseAttack = 5;
	repeated NumericModifierSnapshot Modifiers = 6;
	int32 BaseStamina = 7;
	int32 BaseMaxStamina = 8;
}

message SkillStringValueSnapshot
{
	string Key = 1;
	string Value = 2;
}

message SkillFloatValueSnapshot
{
	string Key = 1;
	float Value = 2;
}

message SkillIntValueSnapshot
{
	string Key = 1;
	int32 Value = 2;
}

message SkillBoolValueSnapshot
{
	string Key = 1;
	bool Value = 2;
}

message SkillDelaySnapshot
{
	int32 NodeId = 1;
	int32 RemainingFrames = 2;
}

message ActiveSkillExecutionSnapshot
{
	int64 CasterId = 1;
	int64 TargetId = 2;
	int32 SkillId = 3;
	int32 CurrentNodeId = 4;
	uint32 Status = 5;
	int32 ExecutedSteps = 6;
	int32 FrameIndex = 7;
	string Message = 8;
	repeated SkillStringValueSnapshot Strings = 9;
	repeated SkillFloatValueSnapshot Floats = 10;
	repeated SkillIntValueSnapshot Ints = 11;
	repeated SkillBoolValueSnapshot Bools = 12;
	repeated SkillDelaySnapshot DelayRemainingFrames = 13;
	int64 DirectionXRaw = 14;
	int64 DirectionYRaw = 15;
}

message PlayerSnapshot
{
	int64 PlayerId = 1;
	int64 XRaw = 2;
	int64 YRaw = 3;
	uint32 LatestAcceptedInputFrame = 4;
	// Compatibility slot: keep field number 5 unused by gameplay code.
	uint32 ReservedField5 = 5;
	int64 LinearVelocityXRaw = 6;
	int64 LinearVelocityYRaw = 7;
	int64 AngularVelocityRaw = 8;
	bool IsAsleep = 9;
	bool IsDisabled = 10;
	uint32 AttributeDirtyMask = 11;
	int32 Health = 12;
	int32 MaxHealth = 13;
	int32 Mana = 14;
	int32 MaxMana = 15;
	int32 Attack = 16;
	repeated BuffSnapshot ActiveBuffs = 17;
	int64 NextRuntimeBuffId = 18;
	NumericSnapshot Numeric = 19;
	uint32 BuffDirtyMask = 20;
	uint32 BuffSnapshotFrameIndex = 21;
	bool IsBuffFullSync = 22;
	int64 RotationRadiansRaw = 23;
	uint32 AttributeBaselineFrameIndex = 24;
	int32 Stamina = 25;
	int32 MaxStamina = 26;
	int32 StaminaRegenCounterFrames = 27;
	int64 DashVelocityXRaw = 28;
	int64 DashVelocityYRaw = 29;
	int32 DashRemainingFrames = 30;
	int64 DashRuntimeBuffId = 31;
	int64 KnockbackVelocityXRaw = 32;
	int64 KnockbackVelocityYRaw = 33;
	int32 KnockbackRemainingFrames = 34;
	int64 KnockbackRuntimeBuffId = 35;
	repeated ActiveSkillExecutionSnapshot SkillExecutions = 36;
}

message FrameContactSnapshot
{
	int32 BodyAId = 1;
	int32 BodyBId = 2;
	bool IsTouching = 3;
}

// 服务端每帧广播快照
message S2C_FrameSnapshot // IMessage
{
	uint32 FrameIndex = 1;
	repeated PlayerSnapshot Players = 2;
	repeated FrameContactSnapshot Contacts = 3;
	// 服务端权威的目标超前帧数。0 表示未启用，客户端退回自算
	uint32 TargetLeadFrames = 4;
}

// 客户端 Ping（单向消息，用于 RTT 测量）
message C2B_Ping // IMessage
{
	uint64 SendTimestampMs = 1;
}

// 服务端 Pong（原样回传时间戳）
message S2C_Pong // IMessage
{
	uint64 SendTimestampMs = 1;
}

// 服务端周期性带宽节省量上报（单向消息）
message S2C_BandwidthStats // IMessage
{
	uint32 FrameIndex = 1;               // 报告窗口结束帧
	bool   MeasureFullSyncBaseline = 2;  // 对照测量是否开启（没开就看不到节省量）
	bool   HasSamples = 3;               // 本窗口是否有发送样本
	int64  ActualPayloadBytes = 4;       // 实际脏同步发的 payload 累计
	int64  FullSyncPayloadBytes = 5;     // 假设全量同步的 payload 累计
	double DirtySyncSavedRatio = 6;      // 节省百分比 %
	int64  DirtySyncSavedBytes = 7;      // 节省的绝对字节数
}

// 客户端逐帧状态哈希上报（单向消息）
message C2B_StateHashReport // IMessage
{
	uint32 FrameIndex = 1;
	uint64 StateHash = 2;
}

// 服务端发起的 RTT 探测（单向）。nonce 为密码学随机 64 位，发出时刻仅存于服务端内存
message S2C_RttProbe // IMessage
{
	uint64 ProbeNonce = 1;
}

// 客户端回执（单向）。原样回传 nonce，不带任何时间戳
message C2B_RttProbeAck // IMessage
{
	uint64 ProbeNonce = 1;
}

// 服务端 RTT 观测值（单向，per-session 构造）
message S2C_RttStats // IMessage
{
	uint32 FrameIndex = 1;
	bool   Enabled = 2;
	bool   HasSample = 3;
	double RttMinMs = 4;          // 链路下界估计，诊断用
	double RttEmaMs = 5;
	double ControlRttMs = 6;      // 非对称滤波后的控制值，HUD 与 report 看这个
	int32  RttSampleCount = 7;
	int32  LeadOutOfBoundsCount = 8;
}




